<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calgary SW — Single-family parcels ≥ 10,000 sq ft</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    header {
      flex: 0 0 auto; z-index: 1000; background: #1a365d; color: #fff;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px 20px; padding: 8px 16px; box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
    header p { font-size: 12px; margin: 2px 0 0; opacity: .85; }
    .titles { flex: 1 1 240px; min-width: 0; }
    .value-filter {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin: 0; flex: 1 1 320px; justify-content: flex-end;
    }
    .filter-label {
      font-size: 11px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; opacity: .9; white-space: nowrap;
    }
    .bounds { display: flex; align-items: center; gap: 6px; flex: 1 1 220px; min-width: 0; }
    .money {
      display: flex; align-items: center; gap: 2px; flex: 1 1 0; min-width: 0;
      background: #fff; color: #1a365d; border-radius: 4px; padding: 0 8px;
      box-sizing: border-box; min-height: 40px;
    }
    .money .prefix { font-size: 14px; font-weight: 600; }
    .money input {
      width: 100%; min-width: 0; border: 0; background: transparent; color: #1a365d;
      font: inherit; font-size: 16px; padding: 8px 0; outline: none;
    }
    .money input::placeholder { color: #718096; }
    .dash { opacity: .85; flex: 0 0 auto; }
    #clear-filter {
      background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55);
      border-radius: 4px; padding: 8px 12px; min-height: 40px; font: inherit; font-size: 13px;
      cursor: pointer;
    }
    #clear-filter:disabled { opacity: .4; cursor: default; }
    #clear-filter:not(:disabled):hover { background: rgba(255,255,255,.12); }
    #map { flex: 1 1 auto; min-height: 0; width: 100%; }
    .legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 1000;
      background: rgba(255,255,255,.96); padding: 10px 12px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; max-width: min(320px, calc(100% - 24px));
    }
    .legend b { margin-right: 4px; }
    #count { font-variant-numeric: tabular-nums; }
    #range { margin-top: 4px; color: #2d3748; }
    #warn { margin-top: 4px; color: #9b2c2c; }
    .popup { font-size: 13px; line-height: 1.45; min-width: 200px; }
    .popup strong { display: block; font-size: 14px; margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .label { color: #555; }
    #bar { height: 3px; background: #2b6cb0; width: 0; transition: width .2s; margin-top: 6px; border-radius: 2px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    @media (max-width: 720px) {
      .value-filter { justify-content: stretch; }
      .filter-label { flex: 1 1 100%; }
      #clear-filter { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="titles">
      <h1>Calgary SW — Single-family homes/lots with land size ≥ 10,000 sq ft</h1>
      <p>Detached, acreage &amp; vacant lots only · multifamily/condo excluded</p>
    </div>
    <form id="value-filter" class="value-filter" autocomplete="off">
      <span class="filter-label" id="value-filter-label">Assessed value</span>
      <div class="bounds" role="group" aria-labelledby="value-filter-label">
        <label class="money">
          <span class="sr">Minimum assessed value in Canadian dollars</span>
          <span class="prefix" aria-hidden="true">$</span>
          <input id="min-value" type="text" inputmode="numeric" placeholder="No min" aria-label="Minimum assessed value in Canadian dollars">
        </label>
        <span class="dash" aria-hidden="true">–</span>
        <label class="money">
          <span class="sr">Maximum assessed value in Canadian dollars</span>
          <span class="prefix" aria-hidden="true">$</span>
          <input id="max-value" type="text" inputmode="numeric" placeholder="No max" aria-label="Maximum assessed value in Canadian dollars">
        </label>
      </div>
      <button type="button" id="clear-filter" disabled>Clear</button>
    </form>
  </header>
  <div id="map"></div>
  <div class="legend">
    <b>Showing</b> <span id="count">Loading…</span>
    <div id="range">All assessed values</div>
    <div id="warn" hidden>Minimum is above maximum.</div>
    <div id="bar"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
(function () {
  var PAGE = 1000;
  // City codes: R110 Detached, R111 Detached+suite, R010 Residential Acreage, A006 Vacant Land
  var WHERE = "assessment_class='RE' AND land_size_sf >= 10000 AND address like '% SW' AND sub_property_use in('R110','R111','R010','A006')";
  var SELECT = "address,land_size_sf,assessed_value,year_of_construction,comm_name,roll_number,sub_property_use,multipolygon";
  var BASE = "https://data.calgary.ca/resource/4bsw-nn7w.json";
  var USE_LABELS = { R110: 'Detached', R111: 'Detached + suite', R010: 'Residential acreage', A006: 'Vacant land' };
  var TOTAL_ESTIMATE = 4300;

  var map = L.map('map', { preferCanvas: true }).setView([50.98, -114.12], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  // Chunked loading is off so filter refreshes cannot race an in-flight chunk.
  var cluster = L.markerClusterGroup({
    chunkedLoading: false, maxClusterRadius: 60, spiderfyOnMaxZoom: true, showCoverageOnHover: false
  }).addTo(map);

  var countEl = document.getElementById('count');
  var rangeEl = document.getElementById('range');
  var warnEl = document.getElementById('warn');
  var barEl = document.getElementById('bar');
  var minEl = document.getElementById('min-value');
  var maxEl = document.getElementById('max-value');
  var clearBtn = document.getElementById('clear-filter');
  var formEl = document.getElementById('value-filter');

  var markers = [];
  var bounds = [];
  var loadComplete = false;
  var filterTimer = null;
  var syncedCount = 0;
  var visibleCount = 0;
  var lastFilterKey = null;

  function fmtNum(n) {
    var x = Number(n);
    return isFinite(x) ? x.toLocaleString('en-CA') : String(n || '');
  }
  function fmtCAD(n) {
    if (n == null || n === '') return '—';
    var x = Number(n);
    return isFinite(x) ? x.toLocaleString('en-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 }) : '—';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function parseMoney(v) {
    if (v == null || v === '') return null;
    var x = Number(String(v).replace(/[$,\s]/g, ''));
    return isFinite(x) ? x : null;
  }
  function parseYear(v) {
    if (v == null || v === '') return null;
    var x = Number(v);
    if (!isFinite(x) || x <= 0) return null;
    return Math.round(x);
  }
  function fmtYear(year) {
    return year == null ? '—' : String(year);
  }
  function readBound(raw) {
    var s = String(raw == null ? '' : raw).replace(/[$,\s]/g, '');
    if (!s) return null;
    var x = Number(s);
    return isFinite(x) ? x : null;
  }
  function currentFilter() {
    return { min: readBound(minEl.value), max: readBound(maxEl.value) };
  }
  function inRange(value, filter) {
    if (filter.min == null && filter.max == null) return true;
    if (value == null || !isFinite(value)) return false;
    if (filter.min != null && value < filter.min) return false;
    if (filter.max != null && value > filter.max) return false;
    return true;
  }
  function rangeLabel(filter) {
    if (filter.min == null && filter.max == null) return 'All assessed values';
    if (filter.min != null && filter.max != null) return fmtCAD(filter.min) + ' – ' + fmtCAD(filter.max);
    if (filter.min != null) return fmtCAD(filter.min) + ' and up';
    return 'Up to ' + fmtCAD(filter.max);
  }
  function filterKey(filter) {
    return (filter.min == null ? '' : String(filter.min)) + '|' + (filter.max == null ? '' : String(filter.max));
  }
  function setProgress(loaded) {
    var pct = loadComplete ? 100 : Math.min(99, (loaded / TOTAL_ESTIMATE) * 100);
    barEl.style.width = pct + '%';
  }
  function centroid(mp) {
    try {
      var ring = mp.coordinates[0][0];
      var sx = 0, sy = 0, n = ring.length;
      for (var i = 0; i < n; i++) { sx += ring[i][0]; sy += ring[i][1]; }
      return [sy / n, sx / n];
    } catch (e) { return null; }
  }
  function popupHtml(marker) {
    return '<div class="popup"><strong>' + escapeHtml(marker.address) + '</strong>' +
      '<div class="row"><span class="label">Type</span><span>' + escapeHtml(marker.useLabel) + '</span></div>' +
      '<div class="row"><span class="label">Year built</span><span>' + fmtYear(marker.yearBuilt) + '</span></div>' +
      '<div class="row"><span class="label">Land size</span><span>' + fmtNum(marker.landSize) + ' sq ft</span></div>' +
      '<div class="row"><span class="label">Assessed</span><span>' + fmtCAD(marker.assessedValue) + '</span></div>' +
      '<div class="row"><span class="label">Community</span><span>' + escapeHtml(marker.community) + '</span></div>' +
      '<div class="row"><span class="label">Roll #</span><span>' + escapeHtml(marker.rollNumber) + '</span></div></div>';
  }
  function applyFilter(rebuild) {
    var filter = currentFilter();
    var key = filterKey(filter);
    if (rebuild || key !== lastFilterKey) {
      var visible = [];
      for (var i = 0; i < markers.length; i++) {
        if (inRange(markers[i].assessedValue, filter)) visible.push(markers[i]);
      }
      cluster.clearLayers();
      if (visible.length) cluster.addLayers(visible);
      visibleCount = visible.length;
      syncedCount = markers.length;
      lastFilterKey = key;
    } else if (syncedCount < markers.length) {
      var fresh = [];
      for (var j = syncedCount; j < markers.length; j++) {
        if (inRange(markers[j].assessedValue, filter)) fresh.push(markers[j]);
      }
      if (fresh.length) cluster.addLayers(fresh);
      visibleCount += fresh.length;
      syncedCount = markers.length;
    }
    var inverted = filter.min != null && filter.max != null && filter.min > filter.max;
    warnEl.hidden = !inverted;
    rangeEl.textContent = rangeLabel(filter);
    clearBtn.disabled = filter.min == null && filter.max == null;
    if (!markers.length && !loadComplete) {
      countEl.textContent = 'Loading…';
    } else if (loadComplete) {
      countEl.textContent = fmtNum(visibleCount) + ' of ' + fmtNum(markers.length);
    } else {
      countEl.textContent = fmtNum(visibleCount) + ' of ' + fmtNum(markers.length) + ' loaded';
    }
  }
  function formatBoundInput(el) {
    var v = readBound(el.value);
    el.value = v == null ? '' : Math.round(v).toLocaleString('en-CA');
  }
  function scheduleFilter() {
    if (filterTimer) clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      filterTimer = null;
      applyFilter(true);
    }, 120);
  }

  minEl.addEventListener('input', scheduleFilter);
  maxEl.addEventListener('input', scheduleFilter);
  minEl.addEventListener('change', function () {
    if (filterTimer) clearTimeout(filterTimer);
    formatBoundInput(minEl);
    applyFilter(true);
  });
  maxEl.addEventListener('change', function () {
    if (filterTimer) clearTimeout(filterTimer);
    formatBoundInput(maxEl);
    applyFilter(true);
  });
  clearBtn.addEventListener('click', function () {
    if (filterTimer) clearTimeout(filterTimer);
    minEl.value = '';
    maxEl.value = '';
    applyFilter(true);
  });
  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    if (filterTimer) clearTimeout(filterTimer);
    formatBoundInput(minEl);
    formatBoundInput(maxEl);
    applyFilter(true);
  });

  window.addEventListener('resize', function () { map.invalidateSize(); });
  requestAnimationFrame(function () { map.invalidateSize(); });

  async function run() {
    var offset = 0;
    setProgress(0);
    try {
      while (true) {
        var url = BASE + '?$select=' + encodeURIComponent(SELECT) +
          '&$where=' + encodeURIComponent(WHERE) +
          '&$order=' + encodeURIComponent('land_size_sf DESC') +
          '&$limit=' + PAGE + '&$offset=' + offset;
        var res = await fetch(url);
        if (!res.ok) throw new Error('API ' + res.status);
        var rows = await res.json();
        if (!rows.length) break;
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var c = centroid(r.multipolygon);
          if (!c) continue;
          bounds.push(c);
          var marker = L.circleMarker(c, {
            radius: 5, color: '#1a365d', weight: 1, fillColor: '#3182ce', fillOpacity: 0.75
          });
          marker.address = r.address;
          marker.useLabel = USE_LABELS[r.sub_property_use] || r.sub_property_use;
          marker.landSize = r.land_size_sf;
          marker.community = r.comm_name;
          marker.rollNumber = r.roll_number;
          marker.assessedValue = parseMoney(r.assessed_value);
          marker.yearBuilt = parseYear(r.year_of_construction);
          marker.bindPopup(popupHtml(marker), { maxWidth: 320 });
          markers.push(marker);
        }
        offset += rows.length;
        setProgress(markers.length);
        applyFilter(false);
        if (rows.length < PAGE) break;
        await new Promise(function (resolve) { setTimeout(resolve, 0); });
      }
      loadComplete = true;
      setProgress(markers.length);
      applyFilter(false);
      if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
    } catch (e) {
      loadComplete = true;
      countEl.textContent = 'Load failed';
      rangeEl.textContent = e.message + ' (try refreshing)';
      console.error(e);
    }
  }
  run();
})();
  </script>
</body>
</html>
